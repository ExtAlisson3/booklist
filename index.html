    <!-- Polyfill: crypto.randomUUID() para contextos não-seguros (HTTP) -->
    <script>
    if (!crypto.randomUUID) {
        crypto.randomUUID = function() {
            const bytes = crypto.getRandomValues(new Uint8Array(16));
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0'));
            return [hex.slice(0,4).join(''), hex.slice(4,6).join(''), hex.slice(6,8).join(''), hex.slice(8,10).join(''), hex.slice(10).join('')].join('-');
        };
        console.log('🔧 Polyfill: crypto.randomUUID ativado (HTTP mode)');
    }
    </script>

    <script>
        if (location.protocol !== 'file:') {
            const manifest = document.createElement('link');
            manifest.rel = 'manifest';
            manifest.href = 'manifest.webmanifest';
            document.head.appendChild(manifest);
        }
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            console.log('[BookList] Nova versão instalada — recarregando...');
                            location.reload();
                        }
                    });
                });
            }).catch(() => {});
        }
